<div class="row">
    <div class="twelve columns">
        <div class="card">
            <div class="card-title">
                <span id="header">Time-lapse</span>
                <span id="loading-status" class="loading-text"></span>
            </div>
            <p style="margin-bottom:12px;color:var(--text-muted);font-size:1.3rem;">
                Browse and view time-lapse recordings stored on the microSD card.
            </p>
            <div style="text-align:center;margin-bottom:16px;">
                <img id="video" width="640" height="360" style="display:none;max-width:100%;height:auto;border-radius:6px;background:#000;border:1px solid var(--card-border);" />
            </div>
            <h5 class="tiny-margin strong" id="title-container" style="color:var(--primary);"></h5>
            <div id="table-container" style="overflow-x:auto;"></div>
        </div>
    </div>
</div>
