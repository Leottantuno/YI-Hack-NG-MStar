<div class="row">
    <div class="twelve columns">
        <div class="card">
            <div class="card-title">
                <span id="header">Motion Events</span>
                <span id="loading-status" class="loading-text"></span>
            </div>
            <p style="margin-bottom:12px;color:var(--text-muted);font-size:1.3rem;">
                Browse recorded motion video clips from the microSD card.
            </p>
            <video id="video" style="display:none;width:100%;max-height:480px;border-radius:6px;background:#000;margin-bottom:16px;" controls autoplay></video>
            <h5 class="tiny-margin strong" id="title-container" style="color:var(--primary);"></h5>
            <div id="table-container" style="overflow-x:auto;"></div>
        </div>
    </div>
</div>
