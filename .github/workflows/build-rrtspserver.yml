name: Build and Release YI-Hack-NG-MStar

on:
  workflow_dispatch:
  push:
    branches: [main, fix-rtsp-597]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prefetch build dependencies on host (avoids EOL container networking/DNS issues)
        env:
          FDK_AAC_SHA256: "a4142815d8d52d0e798212a5adea54ecf42bcd4eec8092b37a8cb615ace91dc6"
          LIVE555_SHA256: "a7c64913f7f7007c5fdc29ea811e3ca781f262271b3e42afdd4bc1041d86fa99"
          LIBLTDL7_SHA256: "897c92de9c09916af8be8cce1288f1f8b3ea2b999b377af36a8e2056b97ac8ea"
          LIBLTDL_DEV_SHA256: "9997651cfc2f2b59456a59e6e602b18ec0a3109bfde798328e840b9fdc78f4a4"
          LIBTOOL_SHA256: "a7ffb2102070340eb6da71dfbb9bb0e8b5b9fb24d5ce3448d9abd3b4cc47417e"
        run: |
          set -e
          cd src/rRTSPServer
          curl -fsSL -o v2.0.1.tar.gz https://github.com/mstorsjo/fdk-aac/archive/v2.0.1.tar.gz
          curl -fsSL -o live.2023.01.19.tar.gz https://download.videolan.org/pub/contrib/live555/live.2023.01.19.tar.gz
          echo "${FDK_AAC_SHA256}  v2.0.1.tar.gz" | sha256sum -c -
          echo "${LIVE555_SHA256}  live.2023.01.19.tar.gz" | sha256sum -c -
          ls -lh v2.0.1.tar.gz live.2023.01.19.tar.gz
          cd ../..

          mkdir -p .debs
          curl -fsSL -o .debs/libltdl7.deb http://old-releases.ubuntu.com/ubuntu/pool/main/libt/libtool/libltdl7_2.4.6-11_i386.deb
          curl -fsSL -o .debs/libltdl-dev.deb http://old-releases.ubuntu.com/ubuntu/pool/main/libt/libtool/libltdl-dev_2.4.6-11_i386.deb
          curl -fsSL -o .debs/libtool.deb http://old-releases.ubuntu.com/ubuntu/pool/main/libt/libtool/libtool_2.4.6-11_all.deb
          echo "${LIBLTDL7_SHA256}  .debs/libltdl7.deb" | sha256sum -c -
          echo "${LIBLTDL_DEV_SHA256}  .debs/libltdl-dev.deb" | sha256sum -c -
          echo "${LIBTOOL_SHA256}  .debs/libtool.deb" | sha256sum -c -

      - name: Build binaries in yi-hack toolchain image
        env:
          YI_HACK_IMAGE: borodiliz/yi-hack@sha256:3af230b23f26b0e5ddee942cd6b2a78da5eb7c8c6e8c615e453cd8b806a1b339
        run: |
          docker run --rm --platform linux/amd64 \
            --entrypoint bash \
            -v "$PWD:/yi-hack-src" \
            -w /yi-hack-src \
            "$YI_HACK_IMAGE" \
            -lc '
              set -e
              export PATH="/opt/yi/arm-linux-gnueabihf-4.8.3-201404/bin:$PATH"
              export DEBIAN_FRONTEND=noninteractive
              dpkg -i .debs/*.deb
              arm-linux-gnueabihf-gcc --version

              echo "=== Building h264grabber ==="
              cd /yi-hack-src/src/h264grabber
              chmod +x compile.h264grabber cleanup.h264grabber || true
              ./compile.h264grabber
              file _install/bin/h264grabber

              echo "=== Building rRTSPServer ==="
              cd /yi-hack-src/src/rRTSPServer
              chmod +x init.rRTSPServer compile.rRTSPServer install.rRTSPServer || true
              ./init.rRTSPServer
              ./compile.rRTSPServer
              file _install/bin/rRTSPServer
            '

      - name: Pack Full Release Firmware Images
        run: |
          chmod +x scripts/pack_release.sh
          VER="$(cat VERSION)"
          echo "Packaging firmware for version: $VER"
          for MODEL in y203c h201c h305r h307 y23 y25 y30; do
            echo "--- Packing $MODEL (full) ---"
            PACK_PROFILE=full ./scripts/pack_release.sh "$MODEL" "$VER" 0.5.8 || echo "Skipping $MODEL if base release not found"
            echo "--- Packing $MODEL (slim) ---"
            PACK_PROFILE=slim ./scripts/pack_release.sh "$MODEL" "$VER" 0.5.8 || echo "Skipping slim $MODEL if base release not found"
          done
          ls -lh out/

      - name: Upload rRTSPServer
        uses: actions/upload-artifact@v4
        with:
          name: rRTSPServer-armhf
          path: src/rRTSPServer/_install/bin/rRTSPServer
          if-no-files-found: error

      - name: Upload h264grabber
        uses: actions/upload-artifact@v4
        with:
          name: h264grabber-armhf
          path: src/h264grabber/_install/bin/h264grabber
          if-no-files-found: error

      - name: Upload Firmware Archives
        uses: actions/upload-artifact@v4
        with:
          name: firmware-packages
          path: out/*.tgz
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.tgz
            src/rRTSPServer/_install/bin/rRTSPServer
            src/h264grabber/_install/bin/h264grabber
          generate_release_notes: true
          draft: false
          prerelease: false
